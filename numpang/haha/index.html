<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratinjau Gambar Ilustrasi - Twitter Card</title>

    <meta property="og:title" content="Ilustrasi Minimalis Pemandangan Kota">
    <meta property="og:description" content="Sebuah ilustrasi seni digital yang menenangkan, menampilkan pemandangan perkotaan dengan palet warna yang lembut.">
    <meta property="og:image" content="https://i.pinimg.com/736x/ee/8b/9c/ee8b9cdf006967cea5b8c87ccbe6b2ab.jpg">
    <meta property="og:url" content="URL_ANDA_DI_SINI"> 
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Pratinjau Gambar Keren">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@NAMA_AKUN_TWITTER_ANDA">
    <meta name="twitter:creator" content="@NAMA_AKUN_TWITTER_ANDA">
    <meta name="twitter:title" content="Seni Digital Pemandangan Kota Senja">
    <meta name="twitter:description" content="Gunakan gambar ini sebagai latar belakang atau inspirasi seni digital. Detail yang halus dan komposisi yang apik.">
    <meta name="twitter:image" content="https://i.pinimg.com/736x/ee/8b/9c/ee8b9cdf006967cea5b8c87ccbe6b2ab.jpg">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9f9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
        }

        .image-preview-container {
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            margin-top: 50px;
        }

        .main-image-area {
            background-color: #000;
            text-align: center;
            max-height: 500px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mainImage {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            max-height: 500px;
        }

        .image-info {
            padding: 15px;
            border-top: 1px solid #eee;
            color: #536471;
            font-size: 0.9em;
        }

        .image-info p {
            margin: 0;
            line-height: 1.5;
        }

        .image-info a {
            color: #1da1f2;
            text-decoration: none;
        }

        .image-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="image-preview-container">
    <div class="main-image-area">
        <img id="mainImage" src="https://i.pinimg.com/736x/ee/8b/9c/ee8b9cdf006967cea5b8c87ccbe6b2ab.jpg" alt="Gambar Ilustrasi">
    </div>

    <div class="image-info">
        <p>Gambar ilustrasi ini ditampilkan dengan Meta Tags yang diperbarui.</p>
        <p>Sumber: <a href="https://i.pinimg.com/736x/ee/8b/9c/ee8b9cdf006967cea5b8c87ccbe6b2ab.jpg" target="_blank">Pinterest</a></p>
    </div>
</div>

</body>
</html>
